<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="warm" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff7e5f"/>
      <stop offset="100%" stop-color="#feb47b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feBlend in="SourceGraphic" in2="b" />
    </filter>
  </defs>

  <!-- Warm gradient background -->
  <rect width="100%" height="100%" fill="url(#warm)" />

  <!-- Soft vignette -->
  <ellipse cx="800" cy="180" rx="700" ry="220" fill="rgba(0,0,0,0.08)"/>

  <!-- Decorative diagonal stripes -->
  <g opacity="0.06" fill="#fff">
    <rect x="-200" y="-50" width="2200" height="60" transform="rotate(-12 0 0)"/>
    <rect x="-200" y="20" width="2200" height="60" transform="rotate(-12 0 0)"/>
    <rect x="-200" y="90" width="2200" height="60" transform="rotate(-12 0 0)"/>
  </g>

  <!-- Large soft circle accent -->
  <circle cx="1300" cy="80" r="120" fill="rgba(255,255,255,0.06)" />

  <!-- Photographic-style light flare (abstract) -->
  <g filter="url(#soft)" opacity="0.18">
    <circle cx="400" cy="60" r="160" fill="#fff" />
  </g>

  <!-- Stylized e-bike silhouette (right-facing) -->
  <g transform="translate(180,230) scale(1.1)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
    <circle cx="0" cy="0" r="42" fill="rgba(255,255,255,0.05)" />
    <circle cx="260" cy="0" r="42" fill="rgba(255,255,255,0.05)" />
    <path d="M0,0 L80,-46 L150,0" />
    <path d="M150,0 L200,-20 L230,-12" />
    <rect x="95" y="-10" width="48" height="18" rx="5" fill="#fff" opacity="0.12" />
  </g>

  <!-- Subtle ground line -->
  <path d="M0,320 L1600,320" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
</svg>
