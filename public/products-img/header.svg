<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0ea5a0"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feBlend in="SourceGraphic" in2="b" />
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- Subtle horizon and road -->
  <rect x="0" y="300" width="100%" height="100" fill="rgba(0,0,0,0.12)" />
  <rect x="0" y="320" width="100%" height="80" fill="rgba(255,255,255,0.03)" />

  <!-- Left accent circle -->
  <circle cx="140" cy="80" r="80" fill="rgba(255,255,255,0.06)" />

  <!-- Simple stylized e-bike silhouette -->
  <g transform="translate(300,200) scale(1.3)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
    <!-- Wheels -->
    <circle cx="0" cy="0" r="40" fill="rgba(255,255,255,0.06)" stroke-width="8"/>
    <circle cx="240" cy="0" r="40" fill="rgba(255,255,255,0.06)" stroke-width="8"/>

    <!-- Frame -->
    <path d="M0,0 L70,-50 L140,0" />
    <path d="M70,-50 L120,-60 L160,-40" />

    <!-- Seat -->
    <rect x="80" y="-68" width="30" height="8" rx="3" fill="#fff" />

    <!-- Handlebars -->
    <path d="M160,-40 L180,-70" />

    <!-- Battery / motor hint -->
    <rect x="90" y="-6" width="40" height="20" rx="6" fill="#fff" opacity="0.12" stroke="none" />
  </g>

  <!-- Title and CTA intentionally removed from SVG so DOM overlay can provide accessible, interactive content -->

  <!-- Decorative thin wave -->
  <path d="M0,280 C240,220 480,320 800,260 C1120,200 1360,300 1600,260 L1600,400 L0,400 Z" fill="rgba(255,255,255,0.03)"/>
</svg>
